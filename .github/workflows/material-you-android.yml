name: Material You Android validation

on:
  push:
    branches:
      - material-you-full-rebuild
      - feature/wireguard-first-hop-import
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: material-you-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK and NDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Build Google debug variant
        run: ./gradlew --no-daemon :mobile:assembleGoogleDebug

      - name: Upload Google debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Windscribe-Material-You-debug-apk
          path: mobile/build/outputs/apk/google/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Run Google debug unit tests
        run: ./gradlew --no-daemon :base:testGoogleDebugUnitTest :mobile:testGoogleDebugUnitTest
