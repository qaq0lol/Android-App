name: Material You Android validation

on:
  push:
    branches:
      - material-you-full-rebuild
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Build Google debug variant
        run: ./gradlew --no-daemon :mobile:assembleGoogleDebug

      - name: Run Google debug unit tests
        run: ./gradlew --no-daemon :mobile:testGoogleDebugUnitTest
